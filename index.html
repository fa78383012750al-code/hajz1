<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2a6496">
  <title>حجـــز — نظام متابعة الطلبات والحسابات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{--primary:#2a6496;--primary-light:#4a90b8;--primary-dark:#114868;--accent:#c9965a;--bg:#edf2f7;--surface:#fff;--surface-2:#f8fafc;--border:#dde8f0;--text:#1a3a52;--text-sec:#5a8aaa;--text-muted:#9bbdd0;--success:#0a7f61;--warning:#b8862a;--danger:#e03c3c;--shadow-sm:0 2px 12px rgba(42,100,150,.07);--shadow-md:0 6px 24px rgba(42,100,150,.12);--shadow-lg:0 16px 48px rgba(0,0,0,.14);--radius-sm:14px;--radius-md:22px}
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
    html,body{height:100%}
    body{background:var(--bg);color:var(--text);overflow-x:hidden}
    .hidden{display:none!important}
    #setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 60%,var(--primary-light) 100%)}
    .setup-box{background:var(--surface);border-radius:var(--radius-md);padding:32px 24px;width:100%;max-width:380px;box-shadow:var(--shadow-lg)}
    .setup-box h1{font-size:2rem;font-weight:800;text-align:center;color:var(--primary);margin-bottom:4px;letter-spacing:4px}
    .setup-box>p{text-align:center;color:var(--text-sec);font-size:.85rem;margin-bottom:22px;line-height:1.7}
    .setup-box label{display:block;font-size:.8rem;font-weight:700;color:var(--text);margin-bottom:6px;margin-top:14px}
    .setup-box input,.setup-box select{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:2px solid var(--border);font-size:16px;outline:none;transition:border .2s;background:var(--surface-2)}
    .setup-box input:focus,.setup-box select:focus{border-color:var(--primary)}
    .setup-box button{width:100%;padding:14px;margin-top:20px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:var(--radius-sm);font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .2s}
    .setup-box button:active{opacity:.85}
    .setup-box button:disabled{opacity:.5;cursor:not-allowed}
    .setup-hint{text-align:center;font-size:.72rem;color:var(--text-muted);margin-top:14px;line-height:1.6}
    .setup-hint code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:.7rem}
    .setup-error{background:#fff0f0;color:var(--danger);padding:10px;border-radius:10px;font-size:.8rem;margin-top:12px;text-align:center}
    #app{min-height:100vh}
    header{background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 60%,var(--primary-light) 100%);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(42,100,150,.2)}
    .brand{font-size:1.5rem;font-weight:800;color:#fff;letter-spacing:3px}
    .user-info{display:flex;align-items:center;gap:8px}
    .user-name{color:rgba(255,255,255,.9);font-size:.8rem;font-weight:600;padding:6px 12px;background:rgba(255,255,255,.15);border-radius:30px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .icon-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:background .2s}
    .icon-btn:hover{background:rgba(255,255,255,.25)}
    .icon-btn.spinning i{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px}
    .sum-card{background:var(--surface);border-radius:var(--radius-sm);padding:14px 12px;box-shadow:var(--shadow-sm);border:1px solid var(--border);text-align:center;position:relative;overflow:hidden;min-width:0}
    .sum-card .label{font-size:.72rem;font-weight:700;color:var(--text-sec);margin-bottom:6px}
    .sum-card .value{font-size:1.15rem;font-weight:800;direction:ltr;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sum-card .sub{font-size:.6rem;color:var(--text-muted);margin-top:4px}
    .sum-card.balance .value{color:var(--success)}
    .sum-card.salary .value{color:var(--warning)}
    .sum-card.pending .value{color:var(--primary)}
    .sum-card.balance::before,.sum-card.salary::before,.sum-card.pending::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%}
    .sum-card.balance::before{background:var(--success)}
    .sum-card.salary::before{background:var(--warning)}
    .sum-card.pending::before{background:var(--primary)}
    .tabs{display:flex;gap:4px;padding:0 16px;margin-bottom:16px}
    .tabs button{flex:1;padding:10px;background:var(--surface);color:var(--text-sec);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s}
    .tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-color:transparent}
    .tab-content{padding:0 16px 100px}
    .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
    .filters::-webkit-scrollbar{display:none}
    .filters button{padding:6px 14px;background:var(--surface);color:var(--text-sec);border:1px solid var(--border);border-radius:20px;font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
    .filters button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .order-card{background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow-sm);border:1px solid var(--border);border-right:3px solid var(--primary);cursor:pointer;transition:transform .15s}
    .order-card:active{transform:scale(.98)}
    .order-card.st-new{border-right-color:#2a6496}
    .order-card.st-in_progress{border-right-color:#b8862a}
    .order-card.st-ready{border-right-color:#0a7f61}
    .order-card.st-delivered{border-right-color:#5a8aaa}
    .order-card.st-cancelled{border-right-color:var(--danger);opacity:.6}
    .order-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .order-ref{font-size:.7rem;font-weight:800;color:var(--primary);background:#e8f0ff;padding:2px 8px;border-radius:8px;flex-shrink:0;direction:ltr}
    .order-title{flex:1;font-size:.85rem;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    .order-status{font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:10px;flex-shrink:0}
    .order-status.st-new{background:#e8f0ff;color:#2a6496}
    .order-status.st-in_progress{background:#fff5ea;color:#b8862a}
    .order-status.st-ready{background:#e6faf4;color:#0a7f61}
    .order-status.st-delivered{background:#f0f4f8;color:#5a8aaa}
    .order-status.st-cancelled{background:#fff0f0;color:var(--danger)}
    .order-meta{display:flex;gap:10px;font-size:.7rem;color:var(--text-sec);flex-wrap:wrap}
    .order-meta span{display:inline-flex;align-items:center;gap:4px}
    .order-meta i{font-size:.65rem;color:var(--text-muted)}
    .empty{text-align:center;padding:48px 20px;color:var(--text-sec)}
    .empty i{font-size:2.5rem;color:var(--text-muted);margin-bottom:12px;display:block}
    .empty h3{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:6px}
    .empty p{font-size:.78rem}
    .fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 28px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:30px;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(42,100,150,.35);z-index:100;transition:transform .15s}
    .fab:active{transform:translateX(-50%) scale(.96)}
    .modal-overlay{position:fixed;inset:0;background:rgba(7,28,51,.55);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal-box{background:var(--surface);border-radius:var(--radius-md) var(--radius-md) 0 0;padding:20px 20px 28px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;animation:slideUp .25s}
    @keyframes slideUp{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
    .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .modal-head h2{font-size:1.1rem;font-weight:800;color:var(--text)}
    .modal-head .close-btn{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;font-size:1.2rem;color:var(--text-sec);display:flex;align-items:center;justify-content:center}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:.78rem;font-weight:700;color:var(--text);margin-bottom:6px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:12px;font-family:inherit;font-size:16px;background:var(--surface-2);outline:none;transition:border .2s;color:var(--text)}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
    .form-group textarea{resize:vertical;min-height:60px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:6px;transition:opacity .2s}
    .btn-primary:active{opacity:.85}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}
    .btn-secondary{width:100%;padding:12px;background:var(--surface-2);color:var(--primary);border:1px solid var(--border);border-radius:12px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:8px}
    .btn-danger{width:100%;padding:12px;background:#fff0f0;color:var(--danger);border:1px solid #fdd;border-radius:12px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:8px}
    .payments-list{margin:12px 0;padding:0;list-style:none}
    .payments-list li{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface-2);border-radius:10px;margin-bottom:6px;font-size:.8rem;gap:8px}
    .payments-list li .pay-info{flex:1;min-width:0}
    .payments-list li .pay-info strong{display:block;font-weight:700}
    .payments-list li .pay-info small{color:var(--text-muted);font-size:.7rem}
    .payments-list li .pay-amount{font-weight:800;color:var(--success);direction:ltr;white-space:nowrap}
    .account-section{background:var(--surface);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
    .account-section h3{font-size:.9rem;font-weight:800;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .account-section h3 i{width:28px;height:28px;background:var(--primary);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.8rem}
    .account-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem;gap:10px}
    .account-line:last-child{border-bottom:none}
    .account-line strong{color:var(--text);direction:ltr;white-space:nowrap}
    .account-line span{color:var(--text-sec);min-width:0}
    .log-entry{background:var(--surface);border-radius:12px;padding:10px 14px;margin-bottom:6px;font-size:.78rem;border-right:3px solid var(--border)}
    .log-entry .log-when{color:var(--text-muted);font-size:.68rem;direction:ltr;text-align:left}
    .log-entry .log-action{font-weight:700;color:var(--text);margin:3px 0}
    .log-entry .log-actor{font-size:.7rem;color:var(--text-sec)}
    .log-entry.created_order{border-right-color:#2a6496}
    .log-entry.updated_order{border-right-color:#b8862a}
    .log-entry.deleted_order{border-right-color:var(--danger)}
    .log-entry.recorded_payment{border-right-color:var(--success)}
    .log-entry.recorded_settlement{border-right-color:var(--accent)}
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:12px 20px;border-radius:30px;font-size:.85rem;font-weight:600;z-index:500;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.success{background:var(--success)}
    .toast.error{background:var(--danger)}
    .loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg)}
    .loading-spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
    .loading-text{color:var(--text-sec);font-size:.9rem;font-weight:600}
    @media (max-width:480px){.summary{padding:12px;gap:6px}.sum-card{padding:12px 8px}.sum-card .value{font-size:1rem}.form-row{grid-template-columns:1fr}}
  </style>
</head>
<body>

<div id="setup" class="screen hidden">
  <div class="setup-box">
    <h1>حجـــز</h1>
    <p>أدخل رمز الوصول (GitHub Token) الخاص بك. يُحفظ على جهازك فقط.</p>
    <label for="setupRole">دورك</label>
    <select id="setupRole">
      <option value="executor">منفّذ (أنا)</option>
      <option value="manager">مدير النظام</option>
    </select>
    <label for="setupName">اسمك للعرض في السجل</label>
    <input type="text" id="setupName" placeholder="مثال: فيصل" autocomplete="off">
    <label for="setupToken">رمز الوصول (Token)</label>
    <input type="password" id="setupToken" placeholder="github_pat_..." dir="ltr" autocomplete="off">
    <button id="setupBtn">دخول</button>
    <p class="setup-hint">المستودع: <code id="setupRepoInfo">—</code></p>
    <div id="setupError" class="setup-error hidden"></div>
  </div>
</div>

<div id="loading" class="loading-screen hidden">
  <div class="loading-spinner"></div>
  <div class="loading-text">جارٍ تحميل البيانات...</div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">حجـــز</div>
    <div class="user-info">
      <span class="user-name" id="userNameDisplay">...</span>
      <button class="icon-btn" id="syncBtn" title="مزامنة الآن"><i class="fas fa-sync"></i></button>
      <button class="icon-btn" id="logoutBtn" title="تسجيل الخروج"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </header>
  <div class="summary">
    <div class="sum-card balance"><div class="label">الرصيد</div><div class="value" id="balanceVal">0</div><div class="sub">عند المدير</div></div>
    <div class="sum-card salary"><div class="label">دين للراتب</div><div class="value" id="salaryVal">0</div><div class="sub">لم يُستلم بعد</div></div>
    <div class="sum-card pending"><div class="label">تحت المراجعة</div><div class="value" id="pendingVal">0</div><div class="sub">قيد التنفيذ</div></div>
  </div>
  <div class="tabs">
    <button data-tab="orders" class="active">الطلبات</button>
    <button data-tab="accounts">الحسابات</button>
    <button data-tab="log">السجل</button>
  </div>
  <div id="tab-orders" class="tab-content">
    <div class="filters" id="filterBar">
      <button data-filter="" class="active">الكل</button>
      <button data-filter="new">جديد</button>
      <button data-filter="in_progress">قيد التنفيذ</button>
      <button data-filter="ready">جاهز</button>
      <button data-filter="delivered">مسلَّم</button>
      <button data-filter="cancelled">ملغي</button>
    </div>
    <div id="ordersList"></div>
    <button id="addOrderBtn" class="fab"><i class="fas fa-plus"></i> طلب جديد</button>
  </div>
  <div id="tab-accounts" class="tab-content hidden"><div id="accountsContent"></div></div>
  <div id="tab-log" class="tab-content hidden"><div id="logContent"></div></div>
</div>

<div id="orderModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="orderModalTitle">طلب جديد</h2>
      <button class="close-btn" id="orderModalClose">×</button>
    </div>
    <div id="orderModalBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============================================================
// 1. CONFIG
// ============================================================
const CONFIG = {
  github: {
    owner: 'fa78383012750al-code',
    repo: 'hajz-data',
    path: 'data.json',
    branch: 'main'
  }
};

const STATUS_LABELS = {
  new: 'جديد',
  in_progress: 'قيد التنفيذ',
  ready: 'جاهز',
  delivered: 'مسلَّم',
  cancelled: 'ملغي'
};

// ============================================================
// 2. STATE
// ============================================================
const state = {
  token: localStorage.getItem('hajz_token') || '',
  role: localStorage.getItem('hajz_role') || 'executor',
  userName: localStorage.getItem('hajz_name') || '',
  data: null,
  sha: null,
  saving: false,
  currentTab: 'orders',
  currentFilter: '',
  editingRef: null,
  retryTimer: null
};

// ============================================================
// 3. HELPERS
// ============================================================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney = n => new Intl.NumberFormat('en-US').format(Math.round(Number(n) || 0));
const nowISO = () => new Date().toISOString();
function fmtDate(iso) {
  if (!iso) return '—';
  try { const d = new Date(iso); if (isNaN(d)) return '—';
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`;
  } catch { return '—'; }
}
function fmtDateShort(iso) {
  if (!iso) return '—';
  try { const d = new Date(iso); if (isNaN(d)) return '—';
    const p = n => String(n).padStart(2,'0');
    return `${p(d.getDate())}/${p(d.getMonth()+1)}`;
  } catch { return '—'; }
}
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToUtf8(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function toast(msg, type = '') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = 'toast ' + type; }, 2600);
}

// ============================================================
// 4. DATA MODEL
// ============================================================
function emptyData() { return { version: 1, orders: [], settlements: [], log: [] }; }
function ensureData(d) {
  if (!d) return emptyData();
  if (!Array.isArray(d.orders)) d.orders = [];
  if (!Array.isArray(d.settlements)) d.settlements = [];
  if (!Array.isArray(d.log)) d.log = [];
  return d;
}
function getNextRef() {
  let max = 1048;
  (state.data.orders || []).forEach(o => {
    const m = /^A-(\d+)$/.exec(o.ref || '');
    if (m) max = Math.max(max, Number(m[1]));
  });
  return 'A-' + (max + 1);
}
function addLog(action, ref, details) {
  if (!state.data) return;
  state.data.log.push({
    at: nowISO(), actor: state.role, actorName: state.userName,
    action, ref: ref || null, details: details || null
  });
  if (state.data.log.length > 1000) state.data.log = state.data.log.slice(-1000);
}

// ============================================================
// 5. GITHUB SYNC
// ============================================================
const GH = {
  url: () => `https://api.github.com/repos/${CONFIG.github.owner}/${CONFIG.github.repo}/contents/${CONFIG.github.path}`,
  headers: () => ({ 'Authorization': `Bearer ${state.token}`, 'Accept': 'application/vnd.github+json' })
};

async function loadData() {
  if (!state.token) throw new Error('لا يوجد رمز وصول');
  const res = await fetch(GH.url(), { headers: GH.headers() });
  if (res.status === 404) {
    state.data = emptyData(); state.sha = null; return;
  }
  if (res.status === 401 || res.status === 403) {
    throw new Error('رمز الوصول غير صالح أو منتهي');
  }
  if (!res.ok) throw new Error('فشل التحميل (' + res.status + ')');
  const json = await res.json();
  state.data = ensureData(JSON.parse(b64ToUtf8(json.content)));
  state.sha = json.sha;
}

async function saveData() {
  if (state.saving) return;
  state.saving = true;
  $('#syncBtn')?.classList.add('spinning');
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const headRes = await fetch(GH.url(), { headers: GH.headers() });
      let remoteSha = null, remoteData = null;
      if (headRes.ok) {
        const j = await headRes.json();
        remoteSha = j.sha;
        try { remoteData = ensureData(JSON.parse(b64ToUtf8(j.content))); } catch (e) {}
      }
      let dataToSave = state.data;
      if (remoteData && remoteSha !== state.sha) {
        dataToSave = mergeData(state.data, remoteData);
      }
      const body = {
        message: `update by ${state.userName || state.role} @ ${nowISO()}`,
        content: utf8ToB64(JSON.stringify(dataToSave, null, 2)),
        branch: CONFIG.github.branch
      };
      if (remoteSha) body.sha = remoteSha;
      const putRes = await fetch(GH.url(), {
        method: 'PUT',
        headers: { ...GH.headers(), 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (putRes.ok) {
        const j = await putRes.json();
        state.sha = j.content.sha;
        state.data = dataToSave;
        state.saving = false;
        $('#syncBtn')?.classList.remove('spinning');
        return true;
      }
      if (putRes.status === 409 || putRes.status === 422) {
        await new Promise(r => setTimeout(r, 300 + Math.random() * 400));
        continue;
      }
      throw new Error('فشل الحفظ (' + putRes.status + ')');
    } catch (e) {
      lastErr = e;
      await new Promise(r => setTimeout(r, 600 * (attempt + 1)));
    }
  }
  state.saving = false;
  $('#syncBtn')?.classList.remove('spinning');
  throw lastErr || new Error('فشل الحفظ بعد 3 محاولات');
}

function mergeData(local, remote) {
  const merged = { version: 1, orders: [], settlements: [], log: [] };
  const remoteMap = new Map((remote.orders || []).map(o => [o.ref, o]));
  const seen = new Set();
  (local.orders || []).forEach(lo => {
    seen.add(lo.ref);
    const ro = remoteMap.get(lo.ref);
    if (!ro) merged.orders.push(lo);
    else {
      const lt = new Date(lo.updatedAt || lo.createdAt || 0).getTime();
      const rt = new Date(ro.updatedAt || ro.createdAt || 0).getTime();
      merged.orders.push(lt >= rt ? lo : ro);
    }
  });
  (remote.orders || []).forEach(ro => { if (!seen.has(ro.ref)) merged.orders.push(ro); });
  const settMap = new Map();
  (remote.settlements || []).forEach(s => settMap.set(s.id, s));
  (local.settlements || []).forEach(s => settMap.set(s.id, s));
  merged.settlements = [...settMap.values()];
  const logMap = new Map();
  const lk = e => `${e.at}|${e.action}|${e.ref || ''}`;
  (remote.log || []).forEach(e => logMap.set(lk(e), e));
  (local.log || []).forEach(e => logMap.set(lk(e), e));
  merged.log = [...logMap.values()].sort((a, b) => new Date(a.at) - new Date(b.at)).slice(-1000);
  return merged;
}

// ============================================================
// 6. FINANCIAL CALCULATIONS
// ============================================================
function calcFinances() {
  let balance = 0, salaryDebt = 0, pending = 0;
  (state.data.orders || []).forEach(o => {
    if (o.deleted || o.status === 'cancelled') return;
    const price = Number(o.price) || 0;
    const myShare = Number(o.myAmount) || 0;
    if (!price || !myShare) return;
    const ratio = myShare / price;
    const paidToManager = (o.payments || []).filter(p => p.paidTo === 'manager').reduce((s, p) => s + (Number(p.amount) || 0), 0);
    const paidToExecutor = (o.payments || []).filter(p => p.paidTo === 'executor').reduce((s, p) => s + (Number(p.amount) || 0), 0);
    if (o.status === 'delivered') {
      balance += paidToManager * ratio;
      const notReceived = price - paidToManager - paidToExecutor;
      if (notReceived > 0) salaryDebt += notReceived * ratio;
    } else {
      pending += myShare;
    }
  });
  (state.data.settlements || []).forEach(s => {
    if (s.to === 'executor') balance -= Number(s.amount) || 0;
  });
  return { balance, salaryDebt, pending };
}

function saveOrder(isNew, ref) {
  const title = $('#of_title').value.trim();
  if (!title) { toast('الرجاء إدخال اسم العمل', 'error'); return; }
  const price = Number($('#of_price').value) || 0;
  const myAmount = Number($('#of_myAmount').value) || 0;
  if (myAmount > price) { toast('حصتك أكبر من السعر الكلي', 'error'); return; }
  const data = {
    title,
    broker: $('#of_broker').value.trim(),
    customer: $('#of_customer').value.trim(),
    status: $('#of_status').value,
    price,
    myAmount,
    dueAt: $('#of_dueAt').value || '',
    note: $('#of_note').value.trim(),
    updatedAt: nowISO()
  };
  if (isNew) {
    state.data.orders.push({
      ref, ...data, createdAt: nowISO(),
      createdBy: state.role, createdByName: state.userName,
      payments: [], deleted: false
    });
    addLog('created_order', ref, title);
  } else {
    const order = state.data.orders.find(o => o.ref === ref);
    if (!order) return;
    Object.assign(order, data);
    addLog('updated_order', ref, title);
  }
  closeOrderModal();
  render();
  commitAndSave();
}

function deleteOrder(ref) {
  if (!confirm('حذف هذا الطلب نهائيًا؟ لا يمكن التراجع.')) return;
  const order = state.data.orders.find(o => o.ref === ref);
  if (!order) return;
  order.deleted = true;
  order.updatedAt = nowISO();
  addLog('deleted_order', ref, order.title);
  closeOrderModal();
  render();
  commitAndSave();
}

function closeOrderModal() {
  $('#orderModal').classList.add('hidden');
  state.editingRef = null;
}

// ============================================================
// 12. PAYMENT MODAL
// ============================================================
function openPaymentModal(ref) {
  const order = state.data.orders.find(o => o.ref === ref);
  if (!order) return;
  const price = Number(order.price) || 0;
  const paid = (order.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const remaining = Math.max(0, price - paid);
  const body = $('#orderModalBody');
  $('#orderModalTitle').textContent = `تسجيل دفعة — ${ref}`;
  body.innerHTML = `
    <p style="text-align:center;color:var(--text-sec);font-size:.82rem;margin-bottom:16px;">
      المتبقي على هذا الطلب: <strong style="color:var(--warning)">${fmtMoney(remaining)} ر.س</strong>
    </p>
    <div class="form-group"><label>المبلغ (ر.س)</label>
      <input type="number" id="pay_amount" value="${remaining}" min="0" max="${remaining}" step="1"></div>
    <div class="form-group"><label>من استلم؟</label>
      <select id="pay_paidTo"><option value="manager">المدير</option><option value="executor">أنا (مباشرة)</option></select></div>
    <div class="form-group"><label>طريقة الدفع</label>
      <select id="pay_method"><option>تحويل بنكي</option><option>نقدًا</option><option>شبكة</option><option>أخرى</option></select></div>
    <button class="btn-primary" id="pay_saveBtn">حفظ الدفعة</button>
    <button class="btn-secondary" id="pay_backBtn">رجوع</button>
  `;
  $('#pay_backBtn').addEventListener('click', () => openOrderModal(ref));
  $('#pay_saveBtn').addEventListener('click', () => {
    const amount = Number($('#pay_amount').value);
    if (!amount || amount <= 0) { toast('مبلغ غير صالح', 'error'); return; }
    if (amount > remaining + 0.5) { toast('المبلغ أكبر من المتبقي', 'error'); return; }
    order.payments.push({
      amount, paidTo: $('#pay_paidTo').value, method: $('#pay_method').value,
      at: nowISO(), by: state.role, byName: state.userName
    });
    order.updatedAt = nowISO();
    addLog('recorded_payment', ref, `${fmtMoney(amount)} ر.س → ${$('#pay_paidTo').value === 'manager' ? 'المدير' : 'المنفذ'}`);
    closeOrderModal();
    render();
    commitAndSave();
    toast('تم تسجيل الدفعة', 'success');
  });
}

// ============================================================
// 14. MASTER RENDER
// ============================================================
function render() {
  if (!state.data) return;
  renderSummary();
  if (state.currentTab === 'orders') renderOrders();
  else if (state.currentTab === 'accounts') renderAccounts();
  else if (state.currentTab === 'log') renderLog();
}

function switchTab(tab) {
  state.currentTab = tab;
  $$('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $$('.tab-content').forEach(c => c.classList.add('hidden'));
  const el = document.getElementById('tab-' + tab);
  if (el) el.classList.remove('hidden');
  $('#addOrderBtn').classList.toggle('hidden', tab !== 'orders');
  render();
}

// ============================================================
// 15. COMMIT
// ============================================================
async function commitAndSave() {
  try {
    await saveData();
    toast('تم الحفظ ✓', 'success');
  } catch (e) {
    toast('فشل الحفظ: ' + e.message + ' — إعادة المحاولة تلقائيًا', 'error');
    if (state.retryTimer) clearTimeout(state.retryTimer);
    state.retryTimer = setTimeout(commitAndSave, 8000);
  }
}

async function manualSync() {
  if (state.saving) { toast('جارٍ الحفظ، انتظر...'); return; }
  try {
    await loadData();
    render();
    toast('تمت المزامنة ✓', 'success');
  } catch (e) {
    toast('فشل المزامنة: ' + e.message, 'error');
  }
}

// ============================================================
// 16. SETUP SCREEN
// ============================================================
function showSetup() {
  $('#setup').classList.remove('hidden');
  $('#loading').classList.add('hidden');
  $('#app').classList.add('hidden');
  $('#setupRole').value = state.role;
  $('#setupName').value = state.userName;
  $('#setupToken').value = state.token;
  $('#setupRepoInfo').textContent = `${CONFIG.github.owner}/${CONFIG.github.repo}`;
}

function showSetupError(msg) {
  const el = $('#setupError');
  el.textContent = msg;
  el.classList.remove('hidden');
}

async function handleSetup() {
  const role = $('#setupRole').value;
  const name = $('#setupName').value.trim();
  const token = $('#setupToken').value.trim();
  if (!name) return showSetupError('أدخل اسمك');
  if (!token) return showSetupError('أدخل رمز الوصول');
  const btn = $('#setupBtn');
  btn.disabled = true;
  btn.textContent = 'جارٍ التحقق...';
  $('#setupError').classList.add('hidden');
  state.token = token;
  state.role = role;
  state.userName = name;
  try {
    await loadData();
    localStorage.setItem('hajz_token', token);
    localStorage.setItem('hajz_role', role);
    localStorage.setItem('hajz_name', name);
    $('#setup').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#userNameDisplay').textContent = name + ' · ' + (role === 'executor' ? 'منفّذ' : 'مدير');
    render();
    toast('مرحبًا، ' + name + ' ✓', 'success');
  } catch (e) {
    showSetupError(e.message);
    state.token = '';
    btn.disabled = false;
    btn.textContent = 'دخول';
  }
}

// ============================================================
// 17. INIT
// ============================================================
function initEvents() {
  $('#setupBtn').addEventListener('click', handleSetup);
  $('#setupToken').addEventListener('keydown', e => { if (e.key === 'Enter') handleSetup(); });
  $('#syncBtn').addEventListener('click', manualSync);
  $('#logoutBtn').addEventListener('click', () => {
    if (!confirm('تسجيل الخروج؟ سيُحذف الرمز من هذا الجهاز.')) return;
    localStorage.removeItem('hajz_token');
    localStorage.removeItem('hajz_role');
    localStorage.removeItem('hajz_name');
    state.token = '';
    state.data = null;
    showSetup();
  });
  $$('.tabs button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  $$('#filterBar button').forEach(b => {
    b.addEventListener('click', () => {
      $$('#filterBar button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.currentFilter = b.dataset.filter;
      renderOrders();
    });
  });
  $('#addOrderBtn').addEventListener('click', () => openOrderModal(null));
  $('#orderModal').addEventListener('click', e => { if (e.target === $('#orderModal')) closeOrderModal(); });
  $('#orderModalClose').addEventListener('click', closeOrderModal);
  window.addEventListener('online', () => {
    if (state.data) { toast('عاد الاتصال — جارٍ المزامنة', 'success'); commitAndSave(); }
  });
}

async function boot() {
  initEvents();
  if (!state.token) { showSetup(); return; }
  $('#loading').classList.remove('hidden');
  try {
    await loadData();
    $('#loading').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#userNameDisplay').textContent = state.userName + ' · ' + (state.role === 'executor' ? 'منفّذ' : 'مدير');
    render();
  } catch (e) {
    $('#loading').classList.add('hidden');
    showSetup();
    showSetupError('فشل الاتصال: ' + e.message + ' — أعد إدخال الرمز');
    state.token = '';
    localStorage.removeItem('hajz_token');
  }
}

document.addEventListener('DOMContentLoaded', boot);
window.openOrderModal = openOrderModal;
window.closeOrderModal = closeOrderModal;
</script>
</body>
</html>
